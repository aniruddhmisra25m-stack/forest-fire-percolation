name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,geo]"
      - name: Unit and statistical tests
        run: pytest -q
      - name: Smoke-test the experiment scripts
        run: |
          python scripts/burn_sweep.py --quick --jobs 2
          python scripts/phase_diagram.py --quick --jobs 2
          python scripts/validate_thresholds.py --quick --jobs 2
          python scripts/finite_size_scaling.py --quick --jobs 2
          python scripts/landscape_percolation.py --quick --jobs 2

  literature:
    # the slower checks against published thresholds (~1 min)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q --runslow -m slow
